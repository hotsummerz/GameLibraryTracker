name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env from repository variables
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
          VITE_COURSE_NAME: ${{ vars.VITE_COURSE_NAME }}
          VITE_STUDENT_NAME: ${{ vars.VITE_STUDENT_NAME }}
          VITE_STUDENT_NIM: ${{ vars.VITE_STUDENT_NIM }}
          VITE_PROFILE_URL: ${{ vars.VITE_PROFILE_URL }}
        run: |
          {
            echo "VITE_APP_NAME=${VITE_APP_NAME}"
            echo "VITE_APP_VERSION=${VITE_APP_VERSION}"
            echo "VITE_COURSE_NAME=${VITE_COURSE_NAME}"
            echo "VITE_STUDENT_NAME=${VITE_STUDENT_NAME}"
            echo "VITE_STUDENT_NIM=${VITE_STUDENT_NIM}"
            echo "VITE_PROFILE_URL=${VITE_PROFILE_URL}"
          } > .env

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
